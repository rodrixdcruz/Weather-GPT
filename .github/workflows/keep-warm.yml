name: Keep backend awake

# Render's free web services spin down after ~15 minutes without inbound
# traffic, so the next visitor pays a 30-50s cold start. One request every 10
# minutes keeps the instance warm.
#
# This runs on GitHub's infrastructure, never on a local machine — that is the
# whole point: the deployment must stay reachable with the laptop switched off.
#
# Free-tier note: each always-on service consumes ~744 of the 750 instance
# hours Render gives free each month, so TWO always-warm services exceed the
# budget (~1488h needed). Accepted knowingly; if services start getting
# suspended mid-month, drop one of the URLs below (or one pinger) first.

on:
  schedule:
    # GitHub's cron is UTC-only. Minutes are offset rather than landing on :00,
    # because scheduled runs are DROPPED (not queued) when GitHub is busy.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health routes
        continue-on-error: true
        run: |
          # /health deliberately never touches the database, so warming the APIs
          # does not hold a Neon connection open.
          #
          # This workflow also warms kisanprofit's backend: its own keep-warm
          # workflow uses the same cron mechanism, but GitHub drops scheduled
          # runs under load and its runs were arriving hours late (observed
          # 2026-09-19: 3h+ gaps). Doubling up here is the documented fix.
          for URL in \
            "https://weather-gpt-1-ze0n.onrender.com/health" \
            "https://kisanprofit-api.onrender.com/health" \
          ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            echo "$URL -> $code"
            if [ "$code" = "200" ]; then
              echo "Warm: $URL"
            else
              # Not a failure while the service is still being set up.
              echo "::warning::$URL returned $code (is the Render service live yet?)"
            fi
          done
