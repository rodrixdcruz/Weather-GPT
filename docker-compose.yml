# MausamBagha AI — full stack. Postgres is always started; Ollama is an
# optional profile (docker compose --profile ai up).
services:
  db:
    # postgis/postgis = Postgres 16 + PostGIS 3. The existing pgdata
    # volume was initialized with PostGIS, so a plain postgres image
    # cannot load its extension libs ($libdir/postgis-3).
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt
      POSTGRES_DB: weathergpt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      # Postgres runs in the db service. The +psycopg driver part is
      # REQUIRED: a bare postgresql:// makes SQLAlchemy default to the
      # psycopg2 dialect, which is not installed (psycopg v3 is).
      DATABASE_URL: postgresql+psycopg://weathergpt:weathergpt@db:5432/weathergpt
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open_meteo}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # Escalation tier (hybrid provider) — a FREE OpenAI-compatible
      # provider. Any key stays in the root .env; compose passes it ONLY
      # into the backend container, never to the frontend.
      # "auto" = Groq when a key is set, else the keyless OVHcloud tier.
      ESCALATION_PROVIDER: ${ESCALATION_PROVIDER:-auto}
      # Ordered failover chain (comma-separated preset names). Empty = just
      # ESCALATION_PROVIDER, no failover. "groq,ovhcloud" absorbs 429s.
      ESCALATION_PROVIDERS: ${ESCALATION_PROVIDERS:-}
      # Seconds a rate-limited escalation provider sits out before it is
      # tried again (429s cannot recover sooner, so retrying only adds latency).
      ESCALATION_COOLDOWN_SECONDS: ${ESCALATION_COOLDOWN_SECONDS:-65}
      ESCALATION_API_KEY: ${ESCALATION_API_KEY:-}
      # Per-provider keys as a JSON map, e.g. {"groq":"gsk_...","gemini":"..."}.
      ESCALATION_API_KEYS: ${ESCALATION_API_KEYS:-}
      ESCALATION_MODEL: ${ESCALATION_MODEL:-}
      ESCALATION_BASE_URL: ${ESCALATION_BASE_URL:-}
      ESCALATION_TIMEOUT_SECONDS: ${ESCALATION_TIMEOUT_SECONDS:-30}
      # Legacy paid tier (only read when ESCALATION_PROVIDER=solar).
      SOLAR_API_KEY: ${SOLAR_API_KEY:-}
      SOLAR_MODEL: ${SOLAR_MODEL:-solar-pro4}
      RISK_PROFILE: ${RISK_PROFILE:-default}
      # Dashboard accounts. Seeding is IDEMPOTENT: it creates these usernames
      # only when they do not already exist, so changing them here does not
      # change a password that is already in the database.
      # Real values live in the root .env (gitignored) — never in this file.
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      # REQUIRED, in development as well as production: "admin123" is a
      # published credential, so defaulting to it would hand a working admin
      # login to anyone who can reach this stack. Set AUTH_ADMIN_PASSWORD in
      # the root .env (see .env.example) before running `docker compose up`.
      AUTH_ADMIN_PASSWORD: "${AUTH_ADMIN_PASSWORD:?set AUTH_ADMIN_PASSWORD in the root .env before starting}"
      # The demo account stays defaulted so a fresh checkout is still demoable.
      # It is a customer-role login and carries no admin rights.
      AUTH_DEMO_USERNAME: ${AUTH_DEMO_USERNAME:-demo}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:-demo123}
      # Judge (hackathon evaluation) account. Same citizen view as demo; the
      # dashboard opens the guided feature tour for it. Set a real value for
      # any deployment judges can reach.
      AUTH_JUDGE_ENABLED: ${AUTH_JUDGE_ENABLED:-true}
      AUTH_JUDGE_USERNAME: ${AUTH_JUDGE_USERNAME:-judge}
      AUTH_JUDGE_PASSWORD: ${AUTH_JUDGE_PASSWORD:-judge123}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Vite dev proxy must reach the backend by compose service name —
      # localhost inside this container is the container itself.
      VITE_API_PROXY_TARGET: http://backend:8000
      # inotify doesn't fire across Windows bind mounts — poll for HMR.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Optional local AI. Start with: docker compose --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  pgdata:
  ollama_models:
