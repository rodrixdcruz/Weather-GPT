# Production nginx config for the built WeatherGPT frontend.
#
# Behaviour is the same as the inline config this replaced: serve the Vite
# build and reverse-proxy /api/ to the backend container. Added for production:
# longer proxy timeouts (AI replies, especially local Ollama, can exceed
# nginx's 60s default), gzip, cache headers for content-hashed assets, and
# basic security headers. No application route, path or response changes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded/requested JSON bodies are small; keep a sane cap.
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API reverse proxy -------------------------------------------------
    # The SPA calls /api/v1/... on its own origin, so the browser sees
    # same-origin requests and CORS is not involved in production.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat can legitimately take a minute or two on the local model.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # --- Static assets -----------------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached hard.
    # add_header is not inherited into this block, so the security headers
    # are repeated here on purpose.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        try_files $uri =404;
    }

    # --- SPA routing -------------------------------------------------------
    # index.html must not be cached, or clients keep an old bundle after a
    # deploy.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        try_files $uri /index.html;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
